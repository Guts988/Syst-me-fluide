<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0e16">
<title>Vocabulaire allemand</title>
<style>
:root{
  --bg:#0a0e16;
  --bg-panel:#0f1a24;
  --cyan:#2de2e6;
  --cyan-dim:rgba(45,226,230,.62);
  --line:rgba(45,226,230,.22);
  --magenta:#ff3fb4;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;}
body{
  min-height:100vh;
  background-color:var(--bg);
  background-image:repeating-linear-gradient(0deg,rgba(45,226,230,.04) 0px,rgba(45,226,230,.04) 1px,transparent 1px,transparent 3px);
  color:var(--cyan);
  font-family:var(--mono);
  font-size:15px;
  line-height:1.6;
  display:flex;
  justify-content:center;
}
main{width:100%;max-width:26rem;padding:2.25rem 1.25rem 3rem;}
button{-webkit-tap-highlight-color:transparent;cursor:pointer;font-family:var(--mono);}
nav{display:flex;gap:1.5rem;padding-bottom:.8rem;border-bottom:1px solid var(--line);margin-bottom:1.5rem;}
nav button{
  background:none;border:0;padding:0 0 .4rem;
  font-size:13px;line-height:1;letter-spacing:.08em;text-transform:uppercase;
  color:var(--cyan-dim);
  border-bottom:2px solid transparent;
  transition:color .15s ease,border-color .15s ease;
}
nav button.on{color:var(--cyan);border-color:var(--cyan);}
.mode{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.mode-btn{
  background:none;border:1px solid var(--cyan-dim);color:var(--cyan-dim);
  font-size:11px;line-height:1;letter-spacing:.05em;text-transform:uppercase;
  padding:.4rem .55rem;border-radius:2px;
  transition:border-color .15s ease,color .15s ease;
}
.mode-btn.on{border-color:var(--cyan);color:var(--cyan);}
.sens{margin:0 0 .5rem;font-size:12px;line-height:1;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan-dim);min-height:.75rem;}
h1{margin:0 0 1.75rem;font-weight:400;font-size:2.1rem;line-height:1.3;text-shadow:0 0 12px rgba(45,226,230,.55);overflow-wrap:anywhere;}
h1.petit{font-size:1.3rem;margin-bottom:1.25rem;text-shadow:none;}
#mot::before{content:"> ";color:var(--cyan-dim);}
#mot::after{content:"█";margin-left:.15em;animation:clignote 1s steps(1) infinite;}
@keyframes clignote{0%,49%{opacity:1;}50%,100%{opacity:0;}}
input{
  display:block;width:100%;
  -webkit-appearance:none;appearance:none;
  font-family:var(--mono);font-size:15px;
  padding:.7rem;
  border:1px solid var(--line);
  border-radius:2px;
  background:var(--bg-panel);
  color:var(--cyan);
  margin-bottom:.9rem;
  transition:border-color .15s ease;
}
input::placeholder{color:var(--cyan-dim);}
input:focus{outline:none;border-color:var(--cyan);}
button.principal{
  width:100%;
  font-size:13px;line-height:1;letter-spacing:.08em;text-transform:uppercase;
  padding:.8rem 1.1rem;
  border:0;border-radius:2px;
  background:var(--cyan);
  color:var(--bg);
  box-shadow:0 0 14px rgba(45,226,230,.45);
  transition:opacity .15s ease;
}
button.principal:active{opacity:.8;}
button:disabled,input:disabled{opacity:.35;}
input:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;}
#retour{min-height:1.3em;margin:1.1rem 0 0;font-weight:600;overflow-wrap:anywhere;}
#retour.ok{color:var(--cyan);}
#retour.ko{color:var(--magenta);}
.score{color:var(--cyan-dim);font-size:12px;margin:.7rem 0 0;text-align:right;}
.note{color:var(--cyan-dim);font-size:12px;margin:1rem 0 0;}
table{width:100%;border-collapse:collapse;margin-top:1.4rem;font-size:13px;}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--cyan-dim);padding:0 .5rem .55rem 0;border-bottom:1px solid var(--line);}
td{padding:.5rem .5rem .5rem 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;color:var(--cyan);}
td.x{width:2rem;text-align:right;padding-right:0;}
.suppr{background:none;border:0;color:var(--magenta);font-size:1rem;line-height:1;padding:.35rem;}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;}
  #mot::after{animation:none;}
}
</style>
</head>
<body>
<main>
  <nav role="tablist">
    <button type="button" id="n-exercice" class="on" role="tab" aria-selected="true" aria-controls="exercice">Exercice</button>
    <button type="button" id="n-liste" role="tab" aria-selected="false" aria-controls="liste">Liste</button>
  </nav>

  <section id="exercice" role="tabpanel" aria-labelledby="n-exercice">
    <div class="mode" role="group" aria-label="Sens de traduction">
      <button type="button" class="mode-btn on" data-mode="alea" aria-pressed="true">Aléatoire</button>
      <button type="button" class="mode-btn" data-mode="de" aria-pressed="false">DE→FR</button>
      <button type="button" class="mode-btn" data-mode="fr" aria-pressed="false">FR→DE</button>
    </div>
    <p class="sens" id="sens"></p>
    <h1 id="mot"></h1>
    <form id="f-ex">
      <input id="rep" type="text" placeholder="traduction" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Traduction">
      <button class="principal" id="ok" type="submit">Vérifier</button>
    </form>
    <p id="retour" aria-live="polite"></p>
    <p class="score" id="score"></p>
  </section>

  <section id="liste" hidden role="tabpanel" aria-labelledby="n-liste">
    <h1 class="petit">Mes mots</h1>
    <form id="f-add">
      <input id="de" type="text" placeholder="allemand" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Mot en allemand">
      <input id="fr" type="text" placeholder="français" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Traduction en français">
      <button class="principal" type="submit">Ajouter</button>
    </form>
    <p class="note">Plusieurs traductions : sépare-les par /. Un mot sans × est dans MOTS_BASE, à modifier dans le fichier.</p>
    <p class="note" id="nb"></p>
    <table>
      <thead><tr><th>Allemand</th><th>Français</th><th></th></tr></thead>
      <tbody id="corps"></tbody>
    </table>
  </section>
</main>

<script>
// Mots : ajoute-les depuis l'onglet Liste, ou directement ici : ["allemand", "français"],
// Plusieurs traductions : sépare-les par /  (ex. "bitte", "s'il vous plaît / de rien")
var MOTS_BASE = [];

var CLE = "vocab-mots-ajoutes";
var CLE_MODE = "vocab-sens-mode";
function $(id) { return document.getElementById(id); }
function lireExtras() {
  try { return JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { return []; }
}
function ecrireExtras(a) {
  try { localStorage.setItem(CLE, JSON.stringify(a)); } catch (e) {}
}
function lireMode() {
  try {
    var m = localStorage.getItem(CLE_MODE);
    return (m === "de" || m === "fr") ? m : "alea";
  } catch (e) { return "alea"; }
}
function ecrireMode(m) {
  try { localStorage.setItem(CLE_MODE, m); } catch (e) {}
}
function tousLesMots() {
  var base = MOTS_BASE.map(function (m) { return { de: m[0], fr: m[1], base: true }; });
  var extras = lireExtras().map(function (m, i) { return { de: m.de, fr: m.fr, base: false, i: i }; });
  return base.concat(extras);
}

function nettoyer(s) {
  return s.toLowerCase().replace(/[’‘]/g, "'").replace(/[.!?,;:]/g, "").replace(/\s+/g, " ").trim();
}
function sansAccents(s) {
  return nettoyer(s).replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function verifier(reponse, attendu) {
  var r = nettoyer(reponse), rs = sansAccents(reponse), res = 0;
  attendu.split(/[\/;]/).forEach(function (v) {
    if (nettoyer(v) === r) res = 2;
    else if (res < 2 && sansAccents(v) === rs) res = 1;
  });
  return res;
}

var mots = [], file = [], cur, direction, attendu, etat = "question", bon = 0, total = 0, sig = "";
var modeSens = lireMode();
var modeBoutons = document.querySelectorAll(".mode-btn");
modeBoutons.forEach(function (b) {
  var actif = b.getAttribute("data-mode") === modeSens;
  b.className = "mode-btn" + (actif ? " on" : "");
  b.setAttribute("aria-pressed", actif ? "true" : "false");
  b.onclick = function () {
    modeSens = b.getAttribute("data-mode");
    ecrireMode(modeSens);
    modeBoutons.forEach(function (x) {
      var on = x === b;
      x.className = "mode-btn" + (on ? " on" : "");
      x.setAttribute("aria-pressed", on ? "true" : "false");
    });
    demarrer();
  };
});

function melanger(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function suivant() {
  etat = "question";
  $("retour").className = ""; $("retour").textContent = "";
  $("rep").value = ""; $("rep").readOnly = false; $("ok").textContent = "Vérifier";
  if (!file.length) file = melanger(mots.slice());
  cur = file.pop();
  direction = modeSens === "alea" ? (Math.random() < 0.5 ? "de" : "fr") : modeSens;
  $("sens").textContent = direction === "de" ? "Allemand → français" : "Français → allemand";
  $("mot").textContent = direction === "de" ? cur.de : cur.fr;
  attendu = direction === "de" ? cur.fr : cur.de;
  $("rep").focus();
}
function demarrer() {
  mots = tousLesMots(); file = [];
  var vide = !mots.length;
  $("rep").disabled = vide; $("ok").disabled = vide;
  if (vide) {
    $("sens").textContent = ""; $("mot").textContent = "Aucun mot";
    $("retour").className = ""; $("retour").textContent = "Ajoute des mots dans l'onglet Liste.";
    return;
  }
  suivant();
}
$("f-ex").onsubmit = function (e) {
  e.preventDefault();
  if (etat === "reponse") { suivant(); return; }
  if (!$("rep").value.trim()) return;
  var r = verifier($("rep").value, attendu), el = $("retour");
  total++; if (r) bon++;
  el.className = r ? "ok" : "ko";
  el.textContent = r === 2 ? "Correct" : r === 1 ? "Correct, orthographe exacte : " + attendu : "Faux, réponse : " + attendu;
  $("score").textContent = "Score : " + bon + " / " + total;
  $("rep").readOnly = true; $("ok").textContent = "Suivant"; etat = "reponse";
};

function afficher() {
  var corps = $("corps"), liste = tousLesMots();
  corps.textContent = "";
  $("nb").textContent = liste.length + (liste.length > 1 ? " mots" : " mot");
  liste.forEach(function (m) {
    var tr = document.createElement("tr");
    [m.de, m.fr].forEach(function (t) {
      var td = document.createElement("td"); td.textContent = t; tr.appendChild(td);
    });
    var x = document.createElement("td"); x.className = "x";
    if (!m.base) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "suppr"; b.textContent = "×";
      b.setAttribute("aria-label", "Supprimer " + m.de);
      b.onclick = function () { var e = lireExtras(); e.splice(m.i, 1); ecrireExtras(e); afficher(); };
      x.appendChild(b);
    }
    tr.appendChild(x);
    corps.appendChild(tr);
  });
}
$("f-add").onsubmit = function (e) {
  e.preventDefault();
  var de = $("de").value.trim(), fr = $("fr").value.trim();
  if (!de || !fr) return;
  var ex = lireExtras(); ex.push({ de: de, fr: fr }); ecrireExtras(ex);
  $("de").value = ""; $("fr").value = ""; $("de").focus();
  afficher();
};

function goTo(page) {
  var exOn = page === "exercice";
  $("exercice").hidden = !exOn;
  $("liste").hidden = exOn;
  $("n-exercice").className = exOn ? "on" : "";
  $("n-exercice").setAttribute("aria-selected", exOn ? "true" : "false");
  $("n-liste").className = exOn ? "" : "on";
  $("n-liste").setAttribute("aria-selected", exOn ? "false" : "true");
  if (!exOn) { afficher(); return; }
  var s = JSON.stringify(tousLesMots());
  if (s !== sig) { sig = s; demarrer(); }
}
$("n-exercice").onclick = function () { goTo("exercice"); };
$("n-liste").onclick = function () { goTo("liste"); };
goTo("exercice");
</script>
</body>
</html>
